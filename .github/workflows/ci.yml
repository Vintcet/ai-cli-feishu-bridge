name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Node.js dependencies
        run: npm ci

      - name: Lint TypeScript
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Node.js tests
        run: npm test

      - name: Build Node.js service
        run: npm run build

      - name: Run desktop tests
        run: dotnet test .\desktop-control\tests\AiCliFeishuTerminalHost.Tests.csproj -c Release

      - name: Run .NET bridge tests
        shell: pwsh
        run: |
          Get-ChildItem .\bridge-dotnet\tests -Filter *.csproj -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              dotnet test $_.FullName -c Release
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }

      - name: Verify desktop and passive .NET Host release
        shell: pwsh
        run: .\scripts\verify-dotnet-shadow-release.ps1
