name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run desktop tests
        run: dotnet test .\desktop-control\tests\AiCliFeishuTerminalHost.Tests.csproj -c Release

      - name: Run .NET bridge tests
        shell: pwsh
        run: |
          Get-ChildItem .\bridge-dotnet\tests -Filter *.csproj -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              dotnet test $_.FullName -c Release
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }

      - name: Build and audit the pure .NET release
        shell: pwsh
        run: .\scripts\build-release.ps1
